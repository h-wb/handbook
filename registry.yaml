# The systems and the repos, listed once. Pages name a system by its id and
# never list repos: add a repo or a system here and nowhere else.
#
# Only this file and a system's own overview (systems/<id>.md) name repos.

board: Orbit, project Homelab (tasks are HOMEL-<n>)

systems:
  - id: handbook
    name: Handbook
    summary: What spans repos, and how we work.
    repos: [handbook]
  - id: miroir
    name: Miroir
    summary: Every source mirrored into one database, with dashboards and a timeline.
    repos: [pipelines, home-ops, dotfiles]
  - id: assistant
    name: The assistant
    summary: Talks to you, runs routines, and will know what is going on.
    repos: [home-ops]
  - id: workshop
    name: The workshop
    summary: Coding agents that build the rest through pull requests.
    repos: [home-ops, dotfiles]
  - id: platform
    name: The platform
    summary: The cluster, the gateways to models and tools, memory.
    repos: [home-ops]
  - id: homelab
    name: The homelab
    summary: Everything else that is self-hosted.
    repos: [home-ops]

repos:
  - id: handbook
    url: https://github.com/h-wb/handbook
    pages: [README.md, how-we-work, systems, decisions]
  - id: home-ops
    url: https://github.com/h-wb/home-ops
    pages: [docs, kubernetes/apps/main/llm, kubernetes/apps/main/automation/miroir, hosts, docker/truenas]
  - id: pipelines
    url: https://github.com/h-wb/pipelines
    pages: [docs]
  - id: dotfiles
    url: https://github.com/h-wb/dotfiles
    pages: []
